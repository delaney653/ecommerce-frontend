
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-frontend
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecom-frontend
  template:
    metadata:
      labels:
        app: ecom-frontend
    spec:
      containers:
      - name: ecom-frontend
        image: delaney653/ecom-frontend:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend-service
  namespace: dev
spec:
  selector:
    app: ecom-frontend
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
  type: NodePort
