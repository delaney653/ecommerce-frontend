# Contains deployments for staging, production, and dev enviornments

# deploy to dev enviornment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-frontend
  namespace: dev
  labels:
    app: ecom-frontend
    environment: dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ecom-frontend
  template:
    metadata:
      labels:
        app: ecom-frontend
        environment: dev
    spec:
      containers:
      - name: ecom-frontend
        image: delaney653/ecom-frontend:2
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: ecom-frontend-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# deploy to staging!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-frontend
  namespace: staging
  labels:
    app: ecom-frontend
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  
  selector:
    matchLabels:
      app: ecom-frontend
  template:
    metadata:
      labels:
        app: ecom-frontend
        environment: staging
    spec:
      containers:
      - name: ecom-frontend
        image: delaney653/ecom-frontend:2
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: ecom-frontend-config
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
# deploy to production!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-frontend
  namespace: production
  labels:
    app: ecom-frontend
    environment: production
spec:
  replicas: 3  # More replicas for production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  #no downtime
  selector:
    matchLabels:
      app: ecom-frontend
  template:
    metadata:
      labels:
        app: ecom-frontend
        environment: production
    spec:
      containers:
      - name: ecom-frontend
        image: delaney653/ecom-frontend:2
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: ecom-frontend-config
        resources: #gets the most resources
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi