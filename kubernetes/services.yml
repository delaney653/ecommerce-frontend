# Contains services for internal + external communication for each environment

#ClusterIP for internal communication
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend-dev-internal
  namespace: dev
  labels:
    app: ecom-frontend
spec:
  type: ClusterIP
  selector:
    app: ecom-frontend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
---
#NodePort for external access
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend-dev-external
  namespace: dev
  labels:
    app: ecom-frontend
spec:
  type: NodePort
  selector:
    app: ecom-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30086
    protocol: TCP
---
#staging
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend-staging-internal
  namespace: staging
spec:
  type: ClusterIP
  selector:
    app: ecom-frontend
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend-staging-external
  namespace: staging
spec:
  type: NodePort
  selector:
    app: ecom-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30084  # Different port for staging
---
#production 
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend-internal
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: ecom-frontend
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend-external
  namespace: production
spec:
  type: NodePort
  selector:
    app: ecom-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30082  #diff port for production