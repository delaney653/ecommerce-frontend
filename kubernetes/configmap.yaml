# Configmaps for each of the environments

apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-frontend-config
  namespace: dev
data:
  NODE_ENV: "development"
  API_BASE_URL: "http://api-service:3001" 
  PORT: "3000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-frontend-config
  namespace: staging
data:
  NODE_ENV: "staging"
  API_BASE_URL: "http://api-service:3001"
  PORT: "3000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-frontend-config
  namespace: production
data:
  NODE_ENV: "production"
  API_BASE_URL: "http://api-service:3001"
  PORT: "3000"